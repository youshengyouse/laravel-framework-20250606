on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          ref: 12.x
          token: ${{ secrets.PAT }}
      
      - name: Sync from source repository
        run: |
          git remote add upstream https://github.com/laravel/framework.git
          git fetch upstream 12.x
          git reset --hard upstream/12.x
      
      - name: Restore workflow files
        run: |
          git checkout workflow .github  # 从workflow分支恢复工作流文件
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Sync from upstream and restore workflows" || echo "No changes to commit"
          git push origin 12.x

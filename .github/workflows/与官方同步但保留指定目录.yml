on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          ref: 12.x
          token: ${{ secrets.PAT }}
          fetch-depth: 0
      
      - name: Backup workflows
        run: |
          mkdir -p /tmp/workflows
          cp -r .github/workflows /tmp/workflows
      
      - name: Sync from source
        run: |
          git remote add upstream https://github.com/laravel/framework.git
          git fetch upstream 12.x
          git reset --hard upstream/12.x
      
      - name: Restore workflows
        run: |
          rm -rf .github/workflows
          cp -r /tmp/workflows .github/
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "Restore workflow files" || echo "No changes to commit"
          git push origin 12.x
